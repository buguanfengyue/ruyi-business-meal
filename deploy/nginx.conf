# nginx site for the API (and optionally the merchant admin web build).
# Replace api.example.com and certificate paths. The domain must be ICP-filed
# and added to the mini-program's "request 合法域名".
server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/api.example.com.pem;
    ssl_certificate_key /etc/nginx/certs/api.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Optional: serve the web build (merchant admin) from the same domain,
    # which avoids any CORS configuration.
    location / {
        root /srv/ruyi/dist;
        try_files $uri /index.html;
    }
}
