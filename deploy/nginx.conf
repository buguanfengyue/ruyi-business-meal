# nginx site for the API (and optionally the merchant admin web build).
# Replace api.example.com and certificate paths. The domain must be ICP-filed
# and added to the mini-program's "request 合法域名".
server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    # Compatible with Ubuntu 22.04 nginx 1.18 (`http2 on;` needs nginx ≥ 1.25.1).
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/api.example.com.pem;
    ssl_certificate_key /etc/nginx/certs/api.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Serve merchant admin only. The customer web replica (index.html) is not
    # production-ready — do not expose it on the public domain root.
    location = / {
        return 302 /admin.html;
    }
    location = /index.html {
        return 404;
    }
    location / {
        root /srv/ruyi/dist;
        try_files $uri =404;
    }
}
